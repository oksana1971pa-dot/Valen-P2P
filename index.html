<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="color-scheme" content="dark">
<title>P2P Terminal</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  if (window.tailwind) {
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#0B0E14', panel: '#151A23', raise: '#1C2330', line: '#252E3C', neon: '#10B981', gold: '#F59E0B' },
          fontFamily: {
            sans: ['"Golos Text"', 'system-ui', '-apple-system', '"Segoe UI"', 'Roboto', 'sans-serif'],
            num: ['Unbounded', '"Golos Text"', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  }
</script>

<style>
  :root {
    --ink: #0B0E14; --panel: #151A23; --raise: #1C2330; --line: #252E3C;
    --neon: #10B981; --gold: #F59E0B; --text: #E7ECF4; --mute: #8B95A7; --rose: #F43F5E;
    --hdr: 56px;
  }
  html { background: var(--ink); color-scheme: dark; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font-family: 'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
    -webkit-font-smoothing: antialiased;
  }
  button { cursor: pointer; font-family: inherit; }
  button:disabled { cursor: default; }
  :focus-visible { outline: 2px solid var(--neon); outline-offset: 2px; }
  .wrap { max-width: 480px; margin-left: auto; margin-right: auto; }
  .num { font-family: 'Unbounded', 'Golos Text', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .tnum { font-variant-numeric: tabular-nums; }
  .mute { color: var(--mute); }
  .gold { color: #FBBF24; }
  .noscroll { scrollbar-width: none; }
  .noscroll::-webkit-scrollbar { display: none; }

  /* Шапка и навигация */
  .hdr { position: sticky; top: 0; z-index: 50; background: rgba(11,14,20,.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid #1B2230; padding-top: env(safe-area-inset-top); }
  .brand { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(11,14,20,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid #1B2230; padding-bottom: env(safe-area-inset-bottom); }
  .nav-in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); }
  .nav button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 9px; color: var(--mute); font-size: 12px; font-weight: 500; background: none; border: 0; }
  .nav button[aria-current="page"] { color: #34D399; }

  /* Тарифные метки */
  .tier { font-weight: 700; font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid #2B3546; color: var(--mute); }
  .tier-pro { color: #34D399; border-color: rgba(16,185,129,.5); background: rgba(16,185,129,.1); }
  .tier-vip { color: #2A1700; border-color: transparent; background: linear-gradient(135deg, #FCD34D, #F59E0B 60%, #D97706); }
  .vipbadge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #2A1700; background: linear-gradient(135deg, #FCD34D, #F59E0B 60%, #D97706); }

  /* Фильтры */
  .filters { position: sticky; z-index: 30; background: rgba(11,14,20,.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid #1B2230; }
  .seg { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 3px; padding: 3px; background: var(--raise); border-radius: 12px; }
  .seg button { height: 38px; border-radius: 9px; border: 0; background: none; color: var(--mute); font-weight: 600; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: #0F2A22; color: #34D399; box-shadow: inset 0 0 0 1px rgba(16,185,129,.45); }
  .chips { display: flex; gap: 8px; overflow-x: auto; }
  .chip { flex: none; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--raise); color: var(--mute); font-weight: 500; font-size: 14px; border: 1px solid transparent; }
  .chip[aria-pressed="true"] { background: rgba(16,185,129,.14); color: #34D399; border-color: rgba(16,185,129,.4); }

  /* Карточки */
  .card { background: var(--panel); border: 1px solid #1E2634; border-radius: 18px; padding: 16px; }
  .card-vip { border-color: rgba(245,158,11,.38); background: linear-gradient(180deg, rgba(245,158,11,.08), rgba(245,158,11,0) 45%), #151A23; }
  .hot { border-color: rgba(16,185,129,.45); box-shadow: 0 10px 32px -14px rgba(16,185,129,.5); }
  .tag { font-size: 12px; font-weight: 500; color: #9AA6B8; background: var(--raise); padding: 4px 9px; border-radius: 8px; white-space: nowrap; }
  .tag-warn { color: #FBBF24; background: rgba(245,158,11,.12); }
  .spread { font-size: 30px; line-height: 1.1; font-weight: 600; color: var(--neon); letter-spacing: -.01em; margin: 0; }
  .spread-hot { text-shadow: 0 0 26px rgba(16,185,129,.6); }

  /* Маршрут: купить -> продать */
  .route { position: relative; display: grid; gap: 14px; }
  .route::before { content: ""; position: absolute; left: 7px; top: 22px; bottom: 22px; width: 2px; border-radius: 2px; background: linear-gradient(#10B981, rgba(16,185,129,.18)); }
  .leg { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; min-height: 44px; }
  .node { width: 16px; height: 16px; border-radius: 50%; position: relative; z-index: 1; }
  .node-buy { background: var(--neon); box-shadow: 0 0 0 4px rgba(16,185,129,.16); }
  .node-sell { background: var(--panel); border: 2px solid var(--neon); box-shadow: 0 0 0 4px rgba(16,185,129,.1); }
  .leg-label { margin: 0 0 3px; font-size: 12px; font-weight: 500; color: #9AA6B8; }
  .leg-label.buy { color: var(--neon); }
  .leg-name { margin: 0; display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 15px; }
  .pm { font-size: 12px; color: #9AA6B8; background: var(--raise); padding: 2px 8px; border-radius: 7px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .leg-price { margin: 0; font-size: 16px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

  /* Закрытая связка */
  .locked { position: relative; overflow: hidden; border-color: rgba(245,158,11,.3); }
  .ghost { filter: blur(7px); opacity: .5; user-select: none; pointer-events: none; }
  .lock-ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 14px; text-align: center; background: radial-gradient(120% 100% at 50% 0%, rgba(245,158,11,.16), rgba(11,14,20,.6)); }
  .lock-ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: #2A1700; background: linear-gradient(135deg, #FCD34D, #F59E0B 60%, #D97706); box-shadow: 0 0 28px rgba(245,158,11,.4); }
  .spread-gold { font-size: 24px; font-weight: 600; margin: 0; background: linear-gradient(135deg, #FDE68A, #F59E0B); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* Кнопки */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 48px; padding: 0 18px; border: 0; border-radius: 14px; font-weight: 600; font-size: 15px; }
  .btn:active:not(:disabled) { transform: scale(.985); }
  .btn:disabled { opacity: .55; }
  .btn-primary { background: var(--neon); color: #04251B; }
  .btn-gold { background: linear-gradient(135deg, #FCD34D, #F59E0B 55%, #D97706); color: #2A1700; }
  .btn-gold-outline { background: rgba(245,158,11,.08); color: #FBBF24; box-shadow: inset 0 0 0 1px rgba(245,158,11,.55); }
  .btn-ghost { background: var(--raise); color: var(--text); }
  .btn-sm { width: auto; height: 40px; padding: 0 14px; border-radius: 12px; font-size: 14px; }

  /* Заявки */
  .amount { font-size: 24px; font-weight: 600; margin: 8px 0 0; letter-spacing: -.01em; }
  .badge { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: 600; }
  .badge-buy { color: #34D399; background: rgba(16,185,129,.13); }
  .badge-sell { color: #FB7185; background: rgba(244,63,94,.12); }
  .creator { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; padding-top: 12px; border-top: 1px solid #1E2634; }
  .hint { font-size: 12px; color: var(--mute); margin: 8px 0 0; text-align: center; }

  /* Профиль и тарифы */
  .avatar { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font-family: 'Unbounded', sans-serif; font-weight: 600; font-size: 20px; background: var(--raise); color: var(--text); flex: none; }
  .avatar-vip { color: #2A1700; background: linear-gradient(135deg, #FCD34D, #F59E0B 60%, #D97706); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stats > div { padding: 2px 0 2px 14px; border-left: 1px solid #1E2634; }
  .stats > div:first-child { padding-left: 0; border-left: 0; }
  .stat-v { margin: 0; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat-l { margin: 2px 0 0; font-size: 12px; color: var(--mute); }
  .plan-price { font-size: 26px; font-weight: 600; margin: 0; letter-spacing: -.02em; }
  .plan-vip { border: 1px solid transparent; background: linear-gradient(180deg, rgba(245,158,11,.1), rgba(245,158,11,0) 50%) padding-box, linear-gradient(#151A23, #151A23) padding-box, linear-gradient(135deg, #FCD34D, #B45309) border-box; box-shadow: 0 14px 40px -18px rgba(245,158,11,.5); }
  .plan-pro { border-color: rgba(16,185,129,.35); }
  .feat { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.35; }
  .feat svg { flex: none; margin-top: 1px; }
  .feat.off { color: var(--mute); }
  .cur-tag { font-size: 12px; font-weight: 600; color: #34D399; background: rgba(16,185,129,.12); padding: 4px 9px; border-radius: 8px; }

  /* Формы */
  .lbl { display: block; font-size: 13px; color: var(--mute); margin-bottom: 6px; }
  .field { display: block; width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; background: var(--raise); border: 1px solid #2A3343; color: var(--text); font-size: 16px; font-family: inherit; }
  .field:focus { outline: none; border-color: var(--neon); box-shadow: 0 0 0 3px rgba(16,185,129,.18); }
  .err { color: #FB7185; font-size: 13px; margin: 0; min-height: 0; }

  /* Окна */
  .backdrop { position: fixed; inset: 0; z-index: 70; background: rgba(3,5,9,.74); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { position: relative; width: 100%; max-width: 480px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: #121722; border: 1px solid #232C3B; border-bottom: 0; border-radius: 24px 24px 0 0; padding: 12px 20px calc(20px + env(safe-area-inset-bottom)); outline: none; }
  .grab { width: 40px; height: 4px; border-radius: 4px; background: #2B3546; margin: 0 auto 16px; }
  .sheet-title { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .sheet-ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; }
  .sheet-ic.vip { color: #2A1700; background: linear-gradient(135deg, #FCD34D, #F59E0B 60%, #D97706); box-shadow: 0 0 36px rgba(245,158,11,.4); }
  .sheet-ic.ok { color: #04251B; background: var(--neon); box-shadow: 0 0 36px rgba(16,185,129,.4); }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid #1E2634; font-size: 14px; }
  .kv:last-child { border-bottom: 0; }
  .kv dt { color: var(--mute); }
  .kv dd { margin: 0; font-weight: 600; text-align: right; min-width: 0; overflow-wrap: anywhere; }

  .toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); z-index: 90; max-width: min(92vw, 440px); padding: 12px 16px; border-radius: 14px; font-size: 14px; font-weight: 500; background: #1C2330; color: var(--text); border: 1px solid #2B3546; opacity: 0; pointer-events: none; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: #2A1219; border-color: rgba(244,63,94,.5); color: #FDA4AF; }
  .toast.ok { background: #0F2A22; border-color: rgba(16,185,129,.5); color: #6EE7B7; }

  .boot { position: fixed; inset: 0; z-index: 100; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #1E2634; border-top-color: var(--neon); }

  .skel { height: 176px; border-radius: 18px; background: linear-gradient(90deg, #151A23, #1B2230, #151A23); background-size: 200% 100%; }
  .live { width: 8px; height: 8px; border-radius: 50%; background: var(--neon); flex: none; }
  .live.warn { background: var(--gold); }

  @media (prefers-reduced-motion: no-preference) {
    .sheet { animation: up .22s ease-out; }
    .backdrop { animation: fade .18s ease-out; }
    .toast { transition: opacity .18s, transform .18s; }
    .skel { animation: shimmer 1.4s linear infinite; }
    .spinner { animation: spin .8s linear infinite; }
    .live:not(.warn) { animation: pulse 1.8s ease-out infinite; }
  }
  @keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.55); } 100% { box-shadow: 0 0 0 8px rgba(16,185,129,0); } }
</style>
</head>

<body>
<noscript><p style="padding:24px;color:#E7ECF4">Для работы приложения нужен JavaScript.</p></noscript>

<div id="boot" class="boot" role="status" aria-live="polite"></div>

<header class="hdr" id="hdr">
  <div class="wrap px-4 h-14 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
        <rect x="3" y="12" width="6" height="11" rx="2" fill="#10B981" fill-opacity=".45"/>
        <rect x="10" y="3" width="6" height="20" rx="2" fill="#10B981"/>
        <rect x="17" y="8" width="6" height="15" rx="2" fill="#F59E0B"/>
      </svg>
      <span class="brand num">P2P Terminal</span>
    </div>
    <div id="hdr-tier"></div>
  </div>
  <div id="test-bar"></div>
</header>

<main class="wrap" id="main" style="padding-bottom: calc(92px + env(safe-area-inset-bottom));">
  <section id="tab-scanner" aria-label="Сканер"></section>
  <section id="tab-otc" aria-label="OTC доска" hidden></section>
  <section id="tab-profile" aria-label="Тарифы и профиль" hidden></section>
</main>

<nav class="nav" aria-label="Разделы">
  <div class="nav-in">
    <button type="button" data-act="tab" data-tab="scanner" aria-current="page">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      <span>Сканер</span>
    </button>
    <button type="button" data-act="tab" data-tab="otc">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h14l-3.5-3.5M20 16H6l3.5 3.5"/></svg>
      <span>OTC Доска</span>
    </button>
    <button type="button" data-act="tab" data-tab="profile">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-3.6 3.8-5.5 7.5-5.5s6.7 1.9 7.5 5.5"/></svg>
      <span>Тарифы / Профиль</span>
    </button>
  </div>
</nav>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ======================= КОНФИГУРАЦИЯ ======================= */
  const API_BASE = "https://valen-p2p-2.onrender.com";
  const ADMIN_CHAT_URL = "https://t.me/your_admin";   // чат администратора для оплаты подписки
  const TEST_ID = 123456;                              // ID по умолчанию вне Telegram
  const PRICES = { pro: 50, vip: 500 };
  const PRO_LIMIT = 3000;
  const FEE = { pro: 0.01, vip: 0.002 };
  const ASSETS = ['USDT', 'BTC'];
  const FIATS = ['UAH', 'RUB', 'BYN', 'PLN'];
  const SYMBOL = { UAH: '₴', RUB: '₽', BYN: 'Br', PLN: 'zł' };
  const BANKS = {
    UAH: ['Monobank', 'PrivatBank', 'A-Bank', 'PUMB', 'Bank Transfer'],
    RUB: ['Tinkoff', 'Sberbank', 'Raiffeisenbank', 'SBP', 'Bank Transfer'],
    BYN: ['Priorbank', 'BelVEB', 'MTBank', 'Alfa-Bank', 'Bank Transfer'],
    PLN: ['Revolut', 'BLIK', 'mBank', 'PKO BP', 'Bank Transfer']
  };
  const RANK = { free: 0, pro: 1, vip: 2 };

  const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

  /* ======================= УТИЛИТЫ ======================= */
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage недоступен */ } }
  };
  const fmt = (n, d) => Number(n).toLocaleString('en-US', { minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d });
  const money = (n, d) => '$' + fmt(n, d == null ? (Number.isInteger(Number(n)) ? 0 : 2) : d);
  const plural = (n, f) => {
    const a = Math.abs(n) % 100, b = a % 10;
    if (a > 10 && a < 20) return f[2];
    if (b > 1 && b < 5) return f[1];
    if (b === 1) return f[0];
    return f[2];
  };
  function agoShort(sec) {
    if (sec < 2) return 'только что';
    if (sec < 60) return sec + ' с назад';
    if (sec < 3600) return Math.floor(sec / 60) + ' мин назад';
    if (sec < 86400) return Math.floor(sec / 3600) + ' ч назад';
    return Math.floor(sec / 86400) + ' д назад';
  }
  function createdAgo(ts) {
    const d = new Date(String(ts).replace(' ', 'T') + 'Z');
    if (isNaN(d.getTime())) return '';
    return agoShort(Math.max(0, Math.round((Date.now() - d.getTime()) / 1000)));
  }
  function setHtml(el, html) {
    if (!el || el.__h === html) return;
    el.__h = html;
    el.innerHTML = html;
  }
  function haptic(kind) {
    try {
      const h = tg && tg.HapticFeedback;
      if (!h) return;
      if (kind === 'success' || kind === 'error') h.notificationOccurred(kind);
      else h.impactOccurred(kind || 'light');
    } catch (e) { /* без вибро */ }
  }
  function openExternal(url) {
    try {
      if (/^tg:\/\//.test(url)) { window.location.href = url; return; }
      if (tg && /^https:\/\/t\.me\//.test(url) && tg.openTelegramLink) { tg.openTelegramLink(url); return; }
      if (tg && tg.openLink) { tg.openLink(url); return; }
    } catch (e) { /* падаем в window.open */ }
    window.open(url, '_blank', 'noopener');
  }

  const I = {
    lock: '<rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    cross: '<path d="M7 7l10 10M17 7L7 17"/>',
    star: '<path fill="currentColor" stroke="none" d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2l-5.4 2.9 1-6.1L3.2 9.7l6.1-.9z"/>',
    crown: '<path d="M3.5 8l4.5 4L12 5l4 7 4.5-4-1.8 11H5.3z"/>',
    shield: '<path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6z"/><path d="M9 12l2.2 2.2L15.5 10"/>',

  };

  class ApiError extends Error {

  }
  function detailText(data, status) {
    if (data && typeof data.detail === 'string') return data.detail;
    if (data && Array.isArray(data.detail)) {
      return data.detail.map((d) => (d && d.msg) ? d.msg : '').filter(Boolean).join('; ') || ('Ошибка запроса (' + status + ')');
    }
    return 'Ошибка сервера (' + status + ')';
  }
  async function api(path, opts) {
    const o = opts || {};
    const url = new URL(API_BASE + path);
    if (o.query) {
      Object.keys(o.query).forEach((k) => {
        const v = o.query[k];
        if (v !== undefined && v !== null && v !== '') url.searchParams.set(k, v);
      });
    }
    const headers = Object.assign({}, o.headers || {});
    if (o.body) headers['Content-Type'] = 'application/json';
    let res;
    try {
      res = await fetch(url.toString(), { method: o.method || 'GET', headers: headers, body: o.body ? JSON.stringify(o.body) : undefined });
    } catch (e) {
      throw new ApiError(0, 'Нет связи с сервером ' + API_BASE + '. Проверьте, что бэкенд запущен.');
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* пустое тело */ }
    if (!res.ok) throw new ApiError(res.status, detailText(data, res.status));
    return data;
  }

    openSheet(
      '<div class="sheet-ic vip">' + icon('crown', 28) + '</div>' +
      '<h2 class="sheet-title mt-4">' + esc(copy[0]) + '</h2>' +
      '<p class="mute text-[14px] mt-2" style="margin-bottom:0">' + esc(copy[1]) + '</p>' +
      '<ul class="grid gap-2.5 mt-5" style="list-style:none;padding:0;margin-bottom:0">' +
        perks.map((p) => '<li class="feat"><span style="color:var(--neon)">' + icon('check', 18) + '</span><span>' + esc(p) + '</span></li>').join('') +
      '</ul>' +
      '<p class="num mt-5" style="font-size:28px;font-weight:600;margin-bottom:0">$' + PRICES.vip + '<span class="mute" style="font-size:14px;font-family:inherit;font-weight:500">/мес</span></p>' +
      '<div class="grid gap-2.5 mt-4">' +
        '<button type="button" class="btn btn-gold" data-act="subscribe" data-tier="vip">Купить VIP за $' + PRICES.vip + '</button>' +
        '<button type="button" class="btn btn-ghost" data-act="goto-tariffs">Сравнить тарифы</button>' +
      '</div>', 'VIP-статус');
  }

  function acceptSheet(id) {
    const o = (S.otc.orders || []).find((x) => x.id === id);
    if (!o) { loadOrders(); return; }
    const t = tier();
    const sym = SYMBOL[o.fiat] || o.fiat;
    const fee = Number(o.amount_usd) * FEE[t];
    openSheet(
      '<h2 class="sheet-title">Принять сделку №' + Number(o.id) + '</h2>' +
      '<dl class="mt-3" style="margin-bottom:0">' +
        '<div class="kv"><dt>Тип</dt><dd>' + (o.type === 'BUY' ? 'Мерчант покупает ' : 'Мерчант продаёт ') + esc(o.asset) + '</dd></div>' +
        '<div class="kv"><dt>Сумма</dt><dd>' + money(o.amount_usd) + '</dd></div>' +
        '<div class="kv"><dt>Цена</dt><dd>' + fmt(o.price) + ' ' + esc(sym) + ' за 1 ' + esc(o.asset) + '</dd></div>' +
        '<div class="kv"><dt>Способ оплаты</dt><dd>' + esc(o.payment_method) + '</dd></div>' +
        '<div class="kv"><dt>Мерчант</dt><dd>' + esc(o.username || ('ID ' + o.creator_id)) + '</dd></div>' +
        '<div class="kv"><dt>Комиссия ' + (FEE[t] * 100).toFixed(1) + '%</dt><dd>' + money(fee, 2) + '</dd></div>' +
      '</dl>' +
      '<div class="grid gap-2.5 mt-4">' +
        '<button type="button" class="btn btn-primary" data-act="confirm-accept" data-id="' + Number(o.id) + '">Принять сделку</button>' +
        '<button type="button" class="btn btn-ghost" data-act="close-sheet">Отмена</button>' +
      '</div>', 'Подтверждение сделки');
  }
  async function doAccept(id, btn) {
    btn.disabled = true; btn.textContent = 'Принимаем…';
    try {
      const o = await api('/api/otc/accept', { method: 'POST', body: { order_id: id, taker_id: S.user.telegram_id } });
      haptic('success');
      acceptedSheet(o);
      loadOrders();
    } catch (e) {
      haptic('error');
      toast(e.message, 'err');
      btn.disabled = false; btn.textContent = 'Принять сделку';
      if (e.status === 403) refreshProfile();
      if (e.status === 404 || e.status === 409) { closeSheet(); loadOrders(); }
    }
  }
  function acceptedSheet(o) {
    const contact = o.username
      ? '<button type="button" class="btn btn-primary" data-act="contact" data-url="https://t.me/' + esc(encodeURIComponent(o.username)) + '">Написать мерчанту</button>'
      : '<button type="button" class="btn btn-primary" data-act="contact" data-url="tg://user?id=' + Number(o.creator_id) + '">Написать мерчанту</button>';
    openSheet(
      '<div class="sheet-ic ok">' + icon('check', 28) + '</div>' +
      '<h2 class="sheet-title mt-4">Сделка в работе</h2>' +
      '<p class="mute text-[14px] mt-2" style="margin-bottom:0">Свяжитесь с мерчантом и договоритесь о переводе. Он подтвердит завершение сделки в приложении.</p>' +
      '<dl class="mt-3" style="margin-bottom:0">' +
        '<div class="kv"><dt>Сделка</dt><dd>№' + Number(o.id) + '</dd></div>' +
        '<div class="kv"><dt>Сумма</dt><dd>' + money(o.amount_usd) + '</dd></div>' +
        '<div class="kv"><dt>Комиссия платформы</dt><dd>' + money(o.fee_amount, 2) + '</dd></div>' +
        '<div class="kv"><dt>Мерчант</dt><dd>' + esc(o.username || ('ID ' + o.creator_id)) + '</dd></div>' +
      '</dl>' +
      '<div class="grid gap-2.5 mt-4">' + contact + '<button type="button" class="btn btn-ghost" data-act="close-sheet">Закрыть</button></div>', 'Сделка в работе');
  }

  function bankOptions(fiat) { return (BANKS[fiat] || []).map((b) => '<option value="' + esc(b) + '"></option>').join(''); }
  function createSheet() {
    const f = S.otc.fiat || 'UAH', a = S.otc.asset || 'USDT';
    openSheet(
      '<h2 class="sheet-title">Новая заявка</h2>' +
      '<form id="create-form" class="grid gap-4 mt-4" novalidate>' +
        '<div class="seg" role="group" aria-label="Тип заявки" id="c-type" data-v="BUY">' +
          '<button type="button" data-act="ctype" data-v="BUY" aria-pressed="true">Покупаю</button>' +
          '<button type="button" data-act="ctype" data-v="SELL" aria-pressed="false">Продаю</button>' +
        '</div>' +
        '<div class="grid grid-cols-2 gap-3">' +
          '<div><label class="lbl" for="c-asset">Актив</label><select id="c-asset" class="field">' + ASSETS.map((x) => '<option' + (x === a ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' +
          '<div><label class="lbl" for="c-fiat">Валюта</label><select id="c-fiat" class="field">' + FIATS.map((x) => '<option' + (x === f ? ' selected' : '') + '>' + x + '</option>').join('') + '</select></div>' +
        '</div>' +
        '<div class="grid grid-cols-2 gap-3">' +
          '<div><label class="lbl" for="c-price" id="c-price-l">Цена за 1 ' + a + ', ' + f + '</label><input id="c-price" class="field tnum" inputmode="decimal" autocomplete="off" placeholder="41.50"></div>' +
          '<div><label class="lbl" for="c-amount">Сумма, USD</label><input id="c-amount" class="field tnum" inputmode="decimal" autocomplete="off" placeholder="5000"></div>' +
        '</div>' +
        '<div><label class="lbl" for="c-pm">Способ оплаты</label><input id="c-pm" class="field" list="pm-list" maxlength="64" autocomplete="off" placeholder="Monobank"><datalist id="pm-list">' + bankOptions(f) + '</datalist></div>' +
        '<p id="create-err" class="err" role="alert"></p>' +
        '<div class="grid gap-2.5"><button type="submit" class="btn btn-gold" id="c-submit">Опубликовать заявку</button><button type="button" class="btn btn-ghost" data-act="close-sheet">Отмена</button></div>' +
      '</form>', 'Новая заявка');
  }
  function syncCreateLabels() {
    const a = $('#c-asset'), f = $('#c-fiat');
    if (!a || !f) return;
    $('#c-price-l').textContent = 'Цена за 1 ' + a.value + ', ' + f.value;
    $('#pm-list').innerHTML = bankOptions(f.value);
  }
  async function submitCreate() {
    const err = $('#create-err'), btn = $('#c-submit');
    const num = (id) => parseFloat(String($(id).value).replace(',', '.').replace(/\s/g, ''));
    const price = num('#c-price'), amount = num('#c-amount'), pm = $('#c-pm').value.trim();
    err.textContent = '';
    if (!(price > 0)) { err.textContent = 'Укажите цену больше нуля.'; return; }
    if (!(amount > 0)) { err.textContent = 'Укажите сумму в USD больше нуля.'; return; }
    if (!pm) { err.textContent = 'Укажите способ оплаты.'; return; }
    btn.disabled = true; btn.textContent = 'Публикуем…';
    try {
      await api('/api/otc/create', { method: 'POST', body: {
        creator_id: S.user.telegram_id, type: $('#c-type').dataset.v, asset: $('#c-asset').value, fiat: $('#c-fiat').value,
        price: price, amount_usd: amount, payment_method: pm
      } });
      haptic('success');
      closeSheet();
      toast('Заявка опубликована', 'ok');
      loadOrders();
    } catch (e) {
      haptic('error');
      err.textContent = e.message;
      btn.disabled = false; btn.textContent = 'Опубликовать заявку';
      if (e.status === 403) refreshProfile();
    }
  }

  /* ======================= ПРОФИЛЬ И ТАРИФЫ ======================= */
  const PLANS = [
    { id: 'free', name: 'FREE', price: '$0', per: '', feats: [
      [1, 'Спреды до 0.5%, не больше 3 связок'],
      [1, 'Просмотр OTC-доски, ники скрыты'],
      [0, 'Принимать сделки'],
      [0, 'Создавать заявки'] ] },
    { id: 'pro', name: 'PRO', price: '$' + PRICES.pro, per: '/мес', feats: [
      [1, 'Спреды до 2.0%, полный список'],
      [1, 'Видны ники мерчантов'],
      [1, 'Принимать сделки до ' + money(PRO_LIMIT) + ', комиссия 1.0%'],
      [0, 'Спреды выше 2.0% и создание заявок'] ] },
    { id: 'vip', name: 'VIP', price: '$' + PRICES.vip, per: '/мес', feats: [
      [1, 'Все спреды в реальном времени'],
      [1, 'Создавать заявки на закрытой доске'],
      [1, 'Сделки без лимита, комиссия 0.2%'],
      [1, 'Первые места в списке заявок'] ] }
  ];
  function planCard(p) {
    const cur = tier();
    const isCur = p.id === cur;
    const canBuy = RANK[p.id] > RANK[cur];
    return '<article class="card ' + (p.id === 'vip' ? 'plan-vip' : (p.id === 'pro' ? 'plan-pro' : '')) + '">' +
      '<div class="flex items-start justify-between gap-3">' +
        '<div><p class="font-bold text-[16px]" style="margin:0">' + (p.id === 'vip' ? '<span class="gold" style="display:inline-flex;vertical-align:-3px;margin-right:6px">' + icon('crown', 18) + '</span>' : '') + p.name + '</p>' +
        '<p class="num plan-price mt-1.5">' + p.price + (p.per ? '<span class="mute" style="font-size:13px;font-family:inherit;font-weight:500">' + p.per + '</span>' : '') + '</p></div>' +
        (isCur ? '<span class="cur-tag">Ваш тариф</span>' : '') +
      '</div>' +
      '<ul class="grid gap-2.5 mt-4" style="list-style:none;padding:0;margin-bottom:0">' +
        p.feats.map((f) => '<li class="feat' + (f[0] ? '' : ' off') + '"><span style="color:' + (f[0] ? 'var(--neon)' : '#5B6578') + '">' + icon(f[0] ? 'check' : 'cross', 18) + '</span><span>' + esc(f[1]) + '</span></li>').join('') +
      '</ul>' +
      (canBuy ? '<button type="button" class="btn ' + (p.id === 'vip' ? 'btn-gold' : 'btn-primary') + ' mt-5" data-act="subscribe" data-tier="' + p.id + '">Оформить подписку</button>' : '') +
    '</article>';
  }
  function testPanel() {
    return '<div class="card mt-3" style="border-style:dashed;border-color:rgba(245,158,11,.4)">' +
      '<p class="font-semibold gold" style="margin:0">Тестовый режим</p>' +
      '<p class="text-[13px] mute mt-1.5" style="margin-bottom:0">Приложение открыто вне Telegram. Введите ID, чтобы войти как другой пользователь.</p>' +
      '<div class="grid grid-cols-2 gap-3 mt-4">' +
        '<div><label class="lbl" for="t-id">Telegram ID</label><input id="t-id" class="field tnum" inputmode="numeric" value="' + esc(S.identity.id) + '"></div>' +
        '<div><label class="lbl" for="t-name">Username</label><input id="t-name" class="field" maxlength="64" value="' + esc(S.identity.username) + '"></div>' +
      '</div>' +
      '<button type="button" class="btn btn-ghost mt-3" data-act="test-login">Войти</button>' +
      '<div class="mt-5"><label class="lbl" for="t-token">Админ-токен (виден в логе сервера при запуске)</label><input id="t-token" class="field" type="password" autocomplete="off" value="' + esc(store.get('p2p_admin_token') || '') + '"></div>' +
      '<div class="grid grid-cols-3 gap-2 mt-3">' +
        ['free', 'pro', 'vip'].map((t) => '<button type="button" class="btn btn-ghost btn-sm" style="width:100%" data-act="test-settier" data-tier="' + t + '">' + t.toUpperCase() + '</button>').join('') +
      '</div>' +
      '<p class="hint" style="text-align:left">Кнопки выше меняют тариф текущего пользователя.</p>' +
    '</div>';
  }
  function renderProfile() {
    const u = S.user;
    if (!u) return;
    const initial = (String(u.username || '').trim().charAt(0) || '#').toUpperCase();
    const ver = !!u.is_verified;
    const html =
      '<div class="px-4 pt-4 pb-6">' +
        '<div class="card' + (u.tier === 'vip' ? ' card-vip' : '') + '">' +
          '<div class="flex items-center gap-3">' +
            '<div class="avatar' + (u.tier === 'vip' ? ' avatar-vip' : '') + '">' + esc(initial) + '</div>' +
            '<div class="min-w-0 flex-1"><p class="font-semibold text-[17px] truncate" style="margin:0">' + esc(u.username || 'Без username') + '</p>' +
            '<p class="text-[13px] mute tnum" style="margin:2px 0 0">ID ' + esc(u.telegram_id) + '</p></div>' +
            tierChip(u.tier) +
          '</div>' +
          '<div class="stats mt-5">' +
            '<div><p class="stat-v gold" style="display:flex;align-items:center;gap:5px">' + icon('star', 17) + Number(u.rating).toFixed(1) + '</p><p class="stat-l">Рейтинг</p></div>' +
            '<div><p class="stat-v">' + Number(u.deals_count) + '</p><p class="stat-l">Завершённых сделок</p></div>' +
            '<div><p class="stat-v" style="color:' + (ver ? 'var(--neon)' : 'var(--mute)') + '">' + (ver ? 'Да' : 'Нет') + '</p><p class="stat-l">Верификация</p></div>' +
          '</div>' +
        '</div>' +
        (S.identity.test ? testPanel() : '') +
        '<h2 class="text-[18px] font-bold" style="margin:24px 0 12px">Тарифы</h2>' +
        '<div class="grid gap-3">' + PLANS.map(planCard).join('') + '</div>' +
        '<p class="text-[13px] mute mt-4" style="margin-bottom:0">Подписка оформляется в чате с администратором. Тариф обновится в приложении после подтверждения оплаты.</p>' +
      '</div>';
    setHtml($('#tab-profile'), html);
  }
  async function doTestLogin() {
    const id = parseInt($('#t-id').value, 10);
    const name = $('#t-name').value.trim().slice(0, 64);
    if (!(id > 0)) { toast('Введите числовой ID больше нуля', 'err'); return; }
    store.set('p2p_test_id', String(id)); store.set('p2p_test_name', name);
    S.identity = { id: id, username: name, test: true };
    try {
      await login();
      S.scan.data = null; S.otc.orders = null;
      renderHeader();
      toast('Вы вошли как ID ' + id, 'ok');
    } catch (e) { toast(e.message, 'err'); }
  }
  async function doSetTier(el) {
    const token = $('#t-token').value.trim();
    if (!token) { toast('Введите админ-токен', 'err'); return; }
    store.set('p2p_admin_token', token);
    try {
      const u = await api('/api/admin/set-tier', { method: 'POST', headers: { 'X-Admin-Token': token }, body: { telegram_id: S.user.telegram_id, tier: el.dataset.tier } });
      setUser(u);
      toast('Тариф ' + u.tier.toUpperCase() + ' выдан', 'ok');
    } catch (e) { toast(e.message, 'err'); }
  }

  /* ======================= ОБРАБОТЧИКИ ======================= */
  const actions = {
    'tab': (el) => showTab(el.dataset.tab),
    'scan-asset': (el) => { S.scan.asset = el.dataset.v; scanFiltersChanged(); },
    'scan-fiat': (el) => { S.scan.fiat = el.dataset.v; scanFiltersChanged(); },
    'otc-asset': (el) => { S.otc.asset = el.dataset.v; otcFiltersChanged(); },
    'otc-fiat': (el) => { S.otc.fiat = el.dataset.v; otcFiltersChanged(); },
    'retry-scan': () => { S.scan.error = null; renderScanList(); loadSpreads(); },
    'retry-otc': () => { S.otc.error = null; renderOtcList(); loadOrders(); },
    'retry-boot': () => boot(),
    'goto-tariffs': () => { closeSheet(true); showTab('profile'); },
    'open-vip': (el) => vipSheet(el.dataset.reason),
    'subscribe': (el) => openAdmin(el.dataset.tier),
    'create-order': () => { if (tier() === 'vip') createSheet(); else vipSheet('create'); },
    'ctype': (el) => {
      const box = $('#c-type');
      box.dataset.v = el.dataset.v;
      box.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === el ? 'true' : 'false'));
    },
    'accept': (el) => acceptSheet(Number(el.dataset.id)),
    'confirm-accept': (el) => doAccept(Number(el.dataset.id), el),
    'close-sheet': () => closeSheet(),
    'contact': (el) => openExternal(el.dataset.url),
    'test-login': () => doTestLogin(),
    'test-settier': (el) => doSetTier(el)
  };
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = actions[el.dataset.act];
    if (fn) fn(el, e);
  });
  document.addEventListener('submit', (e) => {
    if (e.target && e.target.id === 'create-form') { e.preventDefault(); submitCreate(); }
  });
  document.addEventListener('change', (e) => {
    if (e.target && (e.target.id === 'c-asset' || e.target.id === 'c-fiat')) syncCreateLabels();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { clearTimeout(S.scan.timer); clearTimeout(S.otc.timer); return; }
    if (!S.user) return;
    refreshProfile();
    if (S.tab === 'scanner') loadSpreads();
    if (S.tab === 'otc') loadOrders();
  });
  setInterval(() => { if (S.tab === 'scanner' && S.scan.data) renderScanStatus(); }, 1000);
  if (window.ResizeObserver) {
    new ResizeObserver(() => {
      document.documentElement.style.setProperty('--hdr', $('#hdr').offsetHeight + 'px');
    }).observe($('#hdr'));
  }

  /* ======================= ЗАПУСК ======================= */
  function bootScreen(error) {
    const el = $('#boot');
    el.style.display = 'flex';
    el.innerHTML = error
      ? '<div style="color:#FB7185">' + icon('alert', 36) + '</div>' +
        '<p class="font-semibold text-[17px]" style="margin:0">Не удалось войти</p>' +
        '<p class="mute text-[14px]" style="margin:0;max-width:320px">' + esc(error) + '</p>' +
        '<button type="button" class="btn btn-primary" style="max-width:240px" data-act="retry-boot">Повторить</button>'
      : '<div class="spinner" aria-hidden="true"></div><p class="mute text-[14px]" style="margin:0">Подключаемся к серверу…</p>';
  }
  async function boot() {
    bootScreen();
    S.identity = resolveIdentity();
    try {
      await login();
    } catch (e) {
      bootScreen(e.message);
      return;
    }
    buildScannerShell(); buildOtcShell();
    renderHeader();
    $('#boot').style.display = 'none';
    showTab('scanner');
  }

  try {
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('#0B0E14'); tg.setBackgroundColor('#0B0E14'); } catch (e) { /* старая версия клиента */ }
      try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) { /* старая версия клиента */ }
    }
  } catch (e) { /* вне Telegram */ }
  boot();
})();
</script>
</body>
</html>
